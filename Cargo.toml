[package]
name = "neoui"
version = "0.1.0"
edition = "2024"

[dependencies]
fontdue = "0.9.3"
mini = { git = "https://github.com/zfphex/mini", version = "0.1.0", features = ["profile"] }
rustc-hash = "2.1.2"
divan = { version = "0.1.21", optional = true }

[features]
profile = ["mini/profile"]
bench = ["divan"]

[target.'cfg(target_os = "windows")'.dependencies]
# window = { version = "0.1.0", path = "../projects/window" }
window = { version = "0.1.0", git = "https://github.com/zx3no/window", rev = "b489856" }

[target.'cfg(target_os = "macos")'.dependencies]
minifb = "0.27.0"

[[bench]]
name = "font"
harness = false
required-features = ["bench"]

[[bench]]
name = "rect"
harness = false
required-features = ["bench"]